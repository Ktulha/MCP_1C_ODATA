[project]
name = "mcp-1c-odata"
version = "0.1.0"
description = "MCP сервер для 1С через OData с кэшированием, ролями и логированием"
authors = [
    { name = "Ktulha", email = "9145140@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",  # <-- ИЗМЕНЕНО: фиксируем версию на 1.x
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
    "click>=8.0.0",
    "pandas>=2.0.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "rich>=15.0.0",
    "python-dotenv>=1.2.4",
    "starlette>=0.37.0",
]

[project.scripts]
mcp-1c-odata = "mcp_1c_odata:main"
mcp-auth = "mcp_1c_odata.auth.cli:cli"
mcp-admin = "mcp_1c_odata.admin.app:run"
mcp-cache = "mcp_1c_odata.cache.cli:cli"
mcp-sse = "mcp_1c_odata.server_sse:run_sse"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]