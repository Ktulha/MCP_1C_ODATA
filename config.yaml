# ============================================================
# ЛИМИТЫ
# ============================================================
limits:
  response_rows: 50
  odata_timeout_sec: 120

defaults:
  role: viewer
  filter_deletion_mark: true

# ============================================================
# РОЛИ
# ============================================================
roles:
  # --- Минимальный доступ ---
  guest:
    description: "Гость: только базовые справочники (номенклатура, единицы, виды цен)"
    entities:
      - nomenclature
      - nomenclature_categories
      - units
      - units_classifier
      - price_types
      - price_groups
    tools: [list_entities, get_metadata, lookup]
    max_rows: 10

  # --- Просмотр справочников и регистров ---
  viewer:
    description: "Просмотр: все справочники + регистры сведений (цены, остатки, штрихкоды)"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units
      - units_classifier
      - warehouses
      - price_types
      - price_groups
      - specifications
      - spec_composition
      - spec_operations
      - counterparties
      - agreements
      - organizations
      - batches
      - vat_rates
      - countries
      - cashflow_items
      - bank_accounts
      - barcodes
      - prices
      - stock_balance_info
      - default_spec
    tools: [list_entities, get_metadata, lookup]
    max_rows: 20

  # --- Менеджер по продажам ---
  sales:
    description: "Продажи: заказы покупателей, расходные накладные, счета, контрагенты"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units
      - warehouses
      - price_types
      - counterparties
      - agreements
      - organizations
      - barcodes
      - prices
      - stock_balance_info
      - customer_order
      - customer_order_lines
      - sales_doc
      - sales_doc_lines
      - invoice
      - invoice_lines
      - customer_orders_reg
      - settlements
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Менеджер по закупкам ---
  purchases:
    description: "Закупки: заказы поставщикам, приходные накладные, платежи"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units
      - warehouses
      - price_types
      - counterparties
      - agreements
      - organizations
      - barcodes
      - prices
      - stock_balance_info
      - vendor_order
      - vendor_order_lines
      - purchase_doc
      - purchase_doc_lines
      - purchase_doc_expenses
      - purchases_reg
      - settlements
      - cash
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Кладовщик ---
  warehouse:
    description: "Склад: остатки, перемещения, инвентаризация, сборка"
    entities:
      - nomenclature
      - variants
      - units
      - warehouses
      - barcodes
      - stock_balance
      - stock_balance_info
      - stock_moves
      - transfer
      - transfer_lines
      - inventory
      - inventory_lines
      - assembly
      - assembly_lines
      - write_off
      - write_off_lines
      - receipt
      - receipt_lines
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Производство ---
  production:
    description: "Производство: спецификации, сборка, выпуск, распределение затрат"
    entities:
      - nomenclature
      - variants
      - units
      - warehouses
      - specifications
      - spec_composition
      - spec_operations
      - default_spec
      - stock_balance
      - stock_moves
      - assembly
      - assembly_lines
      - cost_allocation
      - cost_allocation_products
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Финансы ---
  finance:
    description: "Финансы: платежи, расчеты, банковские счета, бюджеты"
    entities:
      - counterparties
      - agreements
      - organizations
      - bank_accounts
      - cashflow_items
      - cash
      - settlements
      - income_expenses
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Аналитик (полный доступ на чтение) ---
  analyst:
    description: "Аналитик: полный доступ на чтение всех сущностей"
    entities: ["*"]
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 500

  # --- Администратор (полный доступ + управление) ---
  admin:
    description: "Администратор: полный доступ + управление кэшем и системой"
    entities: ["*"]
    tools: ["*"]
    max_rows: 1000

# ============================================================
# RATE LIMITING
# ============================================================
rate_limits:
  enabled: true
  window_sec: 60
  limits_by_role:
    guest: 10
    viewer: 30
    sales: 60
    purchases: 60
    warehouse: 60
    production: 60
    finance: 60
    analyst: 120
    admin: 300


# ============================================================
# ПЛАНИРОВЩИК
# ============================================================
scheduler:
  enabled: false
  incremental_cron: "0 3 * * *"
  full_cron: ""