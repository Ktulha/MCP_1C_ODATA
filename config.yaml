# ============================================================================
# MCP 1C OData — Конфигурация
# ============================================================================
# Дата: 20 октября 2026
# ============================================================================

odata:
  # --------------------------------------------------------------------------
  # ALLOWLIST — доступные сущности
  # --------------------------------------------------------------------------
  allowlist:
    # ========================================================================
    # СПРАВОЧНИКИ (Catalog)
    # ========================================================================
    - alias: nomenclature
      name: "Catalog_Номенклатура"
      description: "Номенклатура (товары, услуги, работы)"

    - alias: nomenclature_categories
      name: "Catalog_КатегорииНоменклатуры"
      description: "Категории/группы номенклатуры (иерархия)"

    - alias: variants
      name: "Catalog_ХарактеристикиНоменклатуры"
      description: "Характеристики номенклатуры (варианты исполнения)"

    - alias: units_classifier
      name: "Catalog_КлассификаторЕдиницИзмерения"
      description: "Классификатор ОКЕИ (общероссийский классификатор единиц измерения)"

    - alias: warehouses
      name: "Catalog_СтруктурныеЕдиницы"
      description: "Склады / структурные единицы"

    - alias: price_types
      name: "Catalog_ВидыЦен"
      description: "Виды цен (розничная, оптовая, закупочная и т.п.)"

    - alias: specifications
      name: "Catalog_Спецификации"
      description: "Спецификации (состав и операции производства)"

    - alias: spec_composition
      name: "Catalog_Спецификации_Состав"
      description: "Состав спецификаций (материалы/компоненты)"

    - alias: spec_operations
      name: "Catalog_Спецификации_Операции"
      description: "Операции спецификаций (технологические этапы)"

    # ========================================================================
    # РЕГИСТРЫ СВЕДЕНИЙ (InformationRegister)
    # ========================================================================
    - alias: barcodes
      name: "InformationRegister_ШтрихкодыНоменклатуры"
      description: "Штрихкоды номенклатуры"

    - alias: prices
      name: "InformationRegister_ЦеныНоменклатуры"
      description: "Цены номенклатуры (история изменения цен)"

    - alias: stock_balance_info
      name: "InformationRegister_ОстаткиТоваров"
      description: "Остатки товаров (моментальный срез)"

    - alias: default_spec
      name: "InformationRegister_СпецификацииПоУмолчанию"
      description: "Спецификации по умолчанию для номенклатуры"

    # ========================================================================
    # РЕГИСТРЫ НАКОПЛЕНИЯ (AccumulationRegister)
    # ========================================================================
    - alias: stock_balance
      name: "AccumulationRegister_ЗапасыНаСкладах"
      description: "Остатки запасов на складах (моментные срезы)"

    - alias: stock_moves
      name: "AccumulationRegister_Запасы"
      description: "Движения запасов (общий регистр)"

    - alias: purchases_reg
      name: "AccumulationRegister_Закупки"
      description: "Закупки (регистр накопления)"

    # ========================================================================
    # ДОКУМЕНТЫ (Document)
    # ========================================================================
    - alias: sales_doc
      name: "Document_РасходнаяНакладная"
      description: "Расходные накладные (продажи)"

    - alias: sales_doc_lines
      name: "Document_РасходнаяНакладная_Запасы"
      description: "Строки расходных накладных"

    - alias: purchase_doc
      name: "Document_ПриходнаяНакладная"
      description: "Приходные накладные (закупки)"

    - alias: purchase_doc_lines
      name: "Document_ПриходнаяНакладная_Запасы"
      description: "Строки приходных накладных"

    - alias: purchase_doc_expenses
      name: "Document_ПриходнаяНакладная_Расходы"
      description: "Доп. расходы приходных накладных"

    - alias: assembly
      name: "Document_СборкаЗапасов"
      description: "Сборка/разборка запасов (выпуск продукции)"

    - alias: assembly_lines
      name: "Document_СборкаЗапасов_Запасы"
      description: "Строки сборки/разборки запасов"

    - alias: transfer
      name: "Document_ПеремещениеЗапасов"
      description: "Перемещение запасов между складами"

    - alias: transfer_lines
      name: "Document_ПеремещениеЗапасов_Запасы"
      description: "Строки перемещения запасов"

    - alias: write_off
      name: "Document_СписаниеЗапасов"
      description: "Списание запасов"

    - alias: write_off_lines
      name: "Document_СписаниеЗапасов_Запасы"
      description: "Строки списания запасов"

    - alias: receipt
      name: "Document_ОприходованиеЗапасов"
      description: "Оприходование запасов"

    - alias: receipt_lines
      name: "Document_ОприходованиеЗапасов_Запасы"
      description: "Строки оприходования запасов"

  # --------------------------------------------------------------------------
  # МАППИНГ ПОЛЕЙ (реальные имена 1С → короткие алиасы для LLM)
  # --------------------------------------------------------------------------
  field_mapping:
    # --- Справочники ---
    "Catalog_Номенклатура":
      "Ref_Key": "ref_key"
      "Description": "name"
      "Code": "code"
      "Parent_Key": "parent_ref"
      "IsFolder": "is_folder"
      "DeletionMark": "is_deleted"
      "DataVersion": "data_version"
      "ЕдиницаИзмерения_Key": "unit_ref"
      "ВидСтавкиНДС": "vat_type"
      "Весовой": "is_weighted"
      "Артикул": "article"
      "КатегорияНоменклатуры_Key": "category_ref"
      "ЦеноваяГруппа_Key": "price_group_ref"

    "Catalog_КатегорииНоменклатуры":
