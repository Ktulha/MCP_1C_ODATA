# ============================================================================
# ЛИМИТЫ
# ============================================================================
limits:
  response_rows: 50
  odata_timeout_sec: 120

defaults:
  role: viewer
  filter_deletion_mark: true

# ============================================================================
# РОЛИ (синхронизированы с allowlist)
# ============================================================================
roles:
  # --- Гость: минимум справочников ---
  guest:
    description: "Гость: базовые справочники (номенклатура, категории, виды цен)"
    entities:
      - nomenclature
      - nomenclature_categories
      - units_classifier
      - price_types
    tools: [list_entities, get_metadata, lookup]
    max_rows: 10

  # --- Просмотр справочников и регистров ---
  viewer:
    description: "Просмотр: все справочники + регистры сведений (цены, остатки, штрихкоды)"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units_classifier
      - warehouses
      - price_types
      - specifications
      - spec_composition
      - spec_operations
      - barcodes
      - prices
      - stock_balance_info
      - default_spec
    tools: [list_entities, get_metadata, lookup]
    max_rows: 20

  # --- Менеджер по продажам ---
  sales:
    description: "Продажи: расходные накладные, остатки, цены"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units_classifier
      - warehouses
      - price_types
      - barcodes
      - prices
      - stock_balance_info
      - sales_doc
      - sales_doc_lines
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Менеджер по закупкам ---
  purchases:
    description: "Закупки: приходные накладные, регистр закупок"
    entities:
      - nomenclature
      - nomenclature_categories
      - variants
      - units_classifier
      - warehouses
      - price_types
      - barcodes
      - prices
      - stock_balance_info
      - purchase_doc
      - purchase_doc_lines
      - purchase_doc_expenses
      - purchases_reg
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Кладовщик ---
  warehouse:
    description: "Склад: остатки, перемещения, сборка, списание, оприходование"
    entities:
      - nomenclature
      - variants
      - units_classifier
      - warehouses
      - barcodes
      - stock_balance
      - stock_balance_info
      - stock_moves
      - transfer
      - transfer_lines
      - assembly
      - assembly_lines
      - write_off
      - write_off_lines
      - receipt
      - receipt_lines
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Производство ---
  production:
    description: "Производство: спецификации, сборка, выпуск"
    entities:
      - nomenclature
      - variants
      - units_classifier
      - warehouses
      - specifications
      - spec_composition
      - spec_operations
      - default_spec
      - stock_balance
      - stock_moves
      - assembly
      - assembly_lines
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 100

  # --- Аналитик (полный доступ на чтение) ---
  analyst:
    description: "Аналитик: полный доступ на чтение всех сущностей"
    entities: ["*"]
    tools: [list_entities, get_metadata, lookup, fetch_and_process]
    max_rows: 500

  # --- Администратор (полный доступ + управление) ---
  admin:
    description: "Администратор: полный доступ + управление кэшем и системой"
    entities: ["*"]
    tools: ["*"]
    max_rows: 1000

# ============================================================================
# RATE LIMITING
# ============================================================================
rate_limits:
  enabled: true
  window_sec: 60
  limits_by_role:
    guest: 10
    viewer: 30
    sales: 60
    purchases: 60
    warehouse: 60
    production: 60
    analyst: 120
    admin: 300

# ============================================================================
# ПЛАНИРОВЩИК
# ============================================================================
scheduler:
  enabled: false
  incremental_cron: "0 3 * * *"
  full_cron: ""