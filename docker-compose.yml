
services:
  # MCP-сервер (SSE-режим для HTTP/удаленного подключения)
  mcp-server:
    build: .
    container_name: mcp-1c-odata-server
    # ИСПОЛЬЗУЕМ скрипт из pyproject.toml, который корректно запускает SSE через ваш server_sse.py
    command: ["uv", "run", "mcp-sse"]
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./cache:/app/cache
      - ./.env:/app/.env:ro
    environment:
      - MCP_CONFIG_DIR=/app/config
      - MCP_AUTH_DB=/app/data/auth.db
      - MCP_LOGS_DB=/app/data/logs.db
      - MCP_ADMIN_DB=/app/data/admin.db
    restart: unless-stopped

  # Веб-админка (FastAPI на порту 8000)
  admin:
    build: .
    container_name: mcp-1c-odata-admin
    command: ["uv", "run", "mcp-admin", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro       # Папка с конфигами
      - ./data:/app/data              # Базы данных
      - ./cache:/app/cache            # Кэш
      - ./.env:/app/.env:ro           # Явно монтируем файл .env внутрь контейнера
    environment:
      - MCP_CONFIG_DIR=/app/config
      - MCP_AUTH_DB=/app/data/auth.db
      - MCP_LOGS_DB=/app/data/logs.db
      - MCP_ADMIN_DB=/app/data/admin.db
    restart: unless-stopped