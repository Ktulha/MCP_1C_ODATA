
services:
  # MCP-сервер (теперь слушает только внутри Docker-сети)
  mcp-server:
    build: .
    container_name: mcp-1c-odata-server
    command: ["uv", "run", "mcp-sse"]
    # Убираем ports, чтобы сервер был доступен только через Nginx
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./cache:/app/cache
      - ./.env:/app/.env:ro
    environment:
      - MCP_CONFIG_DIR=/app/config
      - MCP_AUTH_DB=/app/data/auth.db
      - MCP_LOGS_DB=/app/data/logs.db
      - MCP_ADMIN_DB=/app/data/admin.db
    restart: unless-stopped

  # Nginx как Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mcp-1c-odata-nginx
    ports:
      - "8001:8001" # Внешний порт
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mcp-server
    restart: unless-stopped

  # Админка (остается без изменений)
  admin:
    build: .
    container_name: mcp-1c-odata-admin
    command: ["uv", "run", "mcp-admin", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./cache:/app/cache
      - ./.env:/app/.env:ro
    environment:
      - MCP_CONFIG_DIR=/app/config
      - MCP_AUTH_DB=/app/data/auth.db
      - MCP_LOGS_DB=/app/data/logs.db
      - MCP_ADMIN_DB=/app/data/admin.db
    restart: unless-stopped