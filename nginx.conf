server {
    listen 8001;
    server_name _;

    location / {
        # Проксируем запрос на python-контейнер
        proxy_pass http://mcp-server:8001;
        
        # КЛЮЧЕВОЙ МОМЕНТ: подменяем Host на валидное значение
        proxy_set_header Host localhost:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Настройки для SSE (Server-Sent Events)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # Увеличиваем таймауты для долгих SSE-соединений
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}