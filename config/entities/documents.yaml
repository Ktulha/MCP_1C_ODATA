# ============================================================================
# ДОКУМЕНТЫ (Document)
# Хозяйственные операции с шапками и табличными частями
# ============================================================================

allowlist:
  # ==========================================================================
  # ПРОДАЖИ (Расходная накладная)
  # ==========================================================================
  - alias: sales_doc
    name: "Document_РасходнаяНакладная"
    description: "Расходные накладные (продажи) — шапка документа"

  - alias: sales_doc_lines
    name: "Document_РасходнаяНакладная_Запасы"
    description: "Строки расходных накладных (номенклатура, количество, цена, сумма)"

  # ==========================================================================
  # ЗАКУПКИ (Приходная накладная)
  # ==========================================================================
  - alias: purchase_doc
    name: "Document_ПриходнаяНакладная"
    description: "Приходные накладные (закупки) — шапка документа"

  - alias: purchase_doc_lines
    name: "Document_ПриходнаяНакладная_Запасы"
    description: "Строки приходных накладных (номенклатура, количество, цена, сумма)"

  - alias: purchase_doc_expenses
    name: "Document_ПриходнаяНакладная_Расходы"
    description: "Дополнительные расходы приходных накладных (доставка, таможня)"

  # ==========================================================================
  # ПРОИЗВОДСТВО / СБОРКА
  # ==========================================================================
  - alias: assembly
    name: "Document_СборкаЗапасов"
    description: "Сборка/разборка запасов (выпуск продукции)"

  - alias: assembly_lines
    name: "Document_СборкаЗапасов_Запасы"
    description: "Строки сборки/разборки запасов (компоненты и готовая продукция)"

  # ==========================================================================
  # ПЕРЕМЕЩЕНИЯ МЕЖДУ СКЛАДАМИ
  # ==========================================================================
  - alias: transfer
    name: "Document_ПеремещениеЗапасов"
    description: "Перемещение запасов между складами"

  - alias: transfer_lines
    name: "Document_ПеремещениеЗапасов_Запасы"
    description: "Строки перемещения запасов"

  # ==========================================================================
  # СПИСАНИЕ (потери, брак, внутреннее потребление)
  # ==========================================================================
  - alias: write_off
    name: "Document_СписаниеЗапасов"
    description: "Списание запасов (потери, брак, внутреннее потребление)"

  - alias: write_off_lines
    name: "Document_СписаниеЗапасов_Запасы"
    description: "Строки списания запасов"

  # ==========================================================================
  # ОПРИХОДОВАНИЕ (излишки, безвозмездное поступление)
  # ==========================================================================
  - alias: receipt
    name: "Document_ОприходованиеЗапасов"
    description: "Оприходование запасов (излишки, безвозмездное поступление)"

  - alias: receipt_lines
    name: "Document_ОприходованиеЗапасов_Запасы"
    description: "Строки оприходования запасов"