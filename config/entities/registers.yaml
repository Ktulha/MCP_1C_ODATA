# ============================================================================
# РЕГИСТРЫ (InformationRegister + AccumulationRegister)
# ============================================================================

allowlist:
  # ==========================================================================
  # РЕГИСТРЫ СВЕДЕНИЙ (InformationRegister)
  # Хранят информацию на определённую дату (периодические срезы)
  # ==========================================================================

  # --- Штрихкоды ---
  - alias: barcodes
    name: "InformationRegister_ШтрихкодыНоменклатуры"
    description: "Штрихкоды номенклатуры (связь штрихкод ↔ товар ↔ характеристика)"

  # --- Цены ---
  - alias: prices
    name: "InformationRegister_ЦеныНоменклатуры"
    description: "Цены номенклатуры (история изменения цен по видам цен)"

  # --- Остатки (регистр сведений) ---
  - alias: stock_balance_info
    name: "InformationRegister_ОстаткиТоваров"
    description: "Остатки товаров (моментальный срез на дату через SliceLast)"

  # --- Спецификации по умолчанию ---
  - alias: default_spec
    name: "InformationRegister_СпецификацииПоУмолчанию"
    description: "Спецификации по умолчанию для номенклатуры"

  # ==========================================================================
  # РЕГИСТРЫ НАКОПЛЕНИЯ (AccumulationRegister)
  # Хранят движения (приход/расход) с привязкой к документу-регистратору
  # ==========================================================================

  # --- Движения запасов (общий регистр) ---
  - alias: stock_moves
    name: "AccumulationRegister_Запасы"
    description: "Движения запасов (история приходов и расходов). ВНИМАНИЕ: Запрашивайте только с фильтром по периоду (period)."
    cache_mode: "filtered_only"  # <-- ЗАПРЕТ на полный кэш

  # --- Остатки на складах (моментный срез) ---
  - alias: stock_balance
    name: "AccumulationRegister_ЗапасыНаСкладах"
    description: "Остатки запасов на складах. Используйте SliceLast для получения актуальных остатков."
    cache_mode: "slice_last"     # <-- Будем кэшировать только текущий срез, а не всё
    