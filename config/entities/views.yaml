allowlist:
  # ==========================================================================
  # ПРОДАЖИ (обогащённые)
  # ==========================================================================
  - alias: sales_enriched
    name: "View_SalesEnriched"
    description: "Обогащённые продажи: строки расходных накладных с именами номенклатуры, складов"
    is_view: true
    view_sql: |
      CREATE OR REPLACE VIEW sales_enriched AS
      SELECT
          l.LineNumber AS line_no,
          d.Date AS doc_date,
          d.Number AS doc_number,
          d.Posted AS is_posted,
          n.Description AS nomenclature_name,
          v.Description AS variant_name,
          w.Description AS warehouse_name,
          l.Количество AS quantity,
          l.Цена AS price,
          l.Сумма AS amount
      FROM read_parquet('{CACHE_PATH}/sales_doc_lines.parquet') l
      LEFT JOIN read_parquet('{CACHE_PATH}/sales_doc.parquet') d
             ON l.Ref_Key = d.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/nomenclature.parquet') n
             ON l.Номенклатура_Key = n.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/variants.parquet') v
             ON l.Характеристика_Key = v.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/warehouses.parquet') w
             ON d.СтруктурнаяЕдиница_Key = w.Ref_Key
      WHERE d.Posted = true AND d.DeletionMark = false

  # ==========================================================================
  # ОСТАТКИ (обогащённые)
  # ==========================================================================
  - alias: stock_enriched
    name: "View_StockEnriched"
    description: "Обогащённые остатки товаров с именами номенклатуры и складов"
    is_view: true
    view_sql: |
      CREATE OR REPLACE VIEW stock_enriched AS
      SELECT
          n.Description AS nomenclature_name,
          v.Description AS variant_name,
          w.Description AS warehouse_name,
          s.Количество AS quantity,
          s.Резерв AS reserve
      FROM read_parquet('{CACHE_PATH}/stock_balance_info.parquet') s
      LEFT JOIN read_parquet('{CACHE_PATH}/nomenclature.parquet') n
             ON s.Номенклатура_Key = n.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/variants.parquet') v
             ON s.Характеристика_Key = v.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/warehouses.parquet') w
             ON s.СтруктурнаяЕдиница = w.Ref_Key

  # ==========================================================================
  # ЦЕНЫ (обогащённые)
  # ==========================================================================
  - alias: prices_enriched
    name: "View_PricesEnriched"
    description: "Обогащённые цены номенклатуры с именами видов цен"
    is_view: true
    view_sql: |
      CREATE OR REPLACE VIEW prices_enriched AS
      SELECT
          p.Period,
          n.Description AS nomenclature_name,
          v.Description AS variant_name,
          pt.Description AS price_type_name,
          p.Цена AS price
      FROM read_parquet('{CACHE_PATH}/prices_last.parquet') p
      LEFT JOIN read_parquet('{CACHE_PATH}/nomenclature.parquet') n
             ON p.Номенклатура_Key = n.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/variants.parquet') v
             ON p.Характеристика_Key = v.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/price_types.parquet') pt
             ON p.ВидЦен_Key = pt.Ref_Key

  # ==========================================================================
  # ЗАКУПКИ (обогащённые)
  # ==========================================================================
  - alias: purchases_enriched
    name: "View_PurchasesEnriched"
    description: "Обогащённые закупки: строки приходных накладных с именами номенклатуры, складов"
    is_view: true
    view_sql: |
      CREATE OR REPLACE VIEW purchases_enriched AS
      SELECT
          l.LineNumber AS line_no,
          d.Date AS doc_date,
          d.Number AS doc_number,
          d.Posted AS is_posted,
          n.Description AS nomenclature_name,
          v.Description AS variant_name,
          w.Description AS warehouse_name,
          l.Количество AS quantity,
          l.Цена AS price,
          l.Сумма AS amount
      FROM read_parquet('{CACHE_PATH}/purchase_doc_lines.parquet') l
      LEFT JOIN read_parquet('{CACHE_PATH}/purchase_doc.parquet') d
             ON l.Ref_Key = d.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/nomenclature.parquet') n
             ON l.Номенклатура_Key = n.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/variants.parquet') v
             ON l.Характеристика_Key = v.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/warehouses.parquet') w
             ON d.СтруктурнаяЕдиница_Key = w.Ref_Key
      WHERE d.Posted = true AND d.DeletionMark = false

  # ==========================================================================
  # ПЕРЕМЕЩЕНИЯ (обогащённые)
  # ==========================================================================
  - alias: transfers_enriched
    name: "View_TransfersEnriched"
    description: "Обогащённые перемещения запасов между складами"
    is_view: true
    view_sql: |
      CREATE OR REPLACE VIEW transfers_enriched AS
      SELECT
          l.LineNumber AS line_no,
          d.Date AS doc_date,
          d.Number AS doc_number,
          d.Posted AS is_posted,
          n.Description AS nomenclature_name,
          v.Description AS variant_name,
          l.Количество AS quantity
      FROM read_parquet('{CACHE_PATH}/transfer_lines.parquet') l
      LEFT JOIN read_parquet('{CACHE_PATH}/transfer.parquet') d
             ON l.Ref_Key = d.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/nomenclature.parquet') n
             ON l.Номенклатура_Key = n.Ref_Key
      LEFT JOIN read_parquet('{CACHE_PATH}/variants.parquet') v
             ON l.Характеристика_Key = v.Ref_Key
      WHERE d.Posted = true AND d.DeletionMark = false